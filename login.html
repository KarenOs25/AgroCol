<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso AgroCol S.A.S</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="card login-box">
        <div class="header-box">
            <img src="AgroCol.png" alt="Logo" class="login-logo">
            <h3>AgroCol S.A.S</h3>
        </div>
        
        <div class="form-box">
            <input type="text" id="u" placeholder="Usuario">
            <input type="password" id="p" placeholder="Contraseña">
            
            <a href="register.html" class="register-link">Crear usuario</a>
            
            <button class="btn btn-primary" onclick="Auth.login()">Ingresar</button>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
