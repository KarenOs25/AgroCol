<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso | AgroCol</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="login-container">
        <h2>AgroCol S.A.S</h2>
        <input type="text" id="user" placeholder="Usuario">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="Auth.login(document.getElementById('user').value, document.getElementById('pass').value)">
            Ingresar al Sistema
        </button>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
