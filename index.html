<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroCol | Acceso Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <div id="login-view" class="card">
            <h2>Iniciar Sesión</h2>
            <input type="text" id="l-user" placeholder="Usuario o Correo">
            <input type="password" id="l-pass" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
            <p onclick="toggleView()">¿No tienes cuenta? Regístrate</p>
        </div>

        <div id="register-view" class="card hidden">
            <h2>Registro AgroCol</h2>
            <input type="text" id="r-nombre" placeholder="Nombre Completo">
            <input type="text" id="r-user" placeholder="Usuario">
            <input type="email" id="r-mail" placeholder="Correo">
            <input type="password" id="r-pass" placeholder="Contraseña (6+ caracteres)">
            <input type="password" id="r-pass2" placeholder="Confirmar contraseña">
            <button onclick="register()">Crear Cuenta</button>
            <p onclick="toggleView()">¿Ya tienes cuenta? Inicia Sesión</p>
        </div>
    </div>

    <div id="app-view" class="hidden">
        <nav><h2>AgroCol S.A.S</h2> <button onclick="logout()">Cerrar Sesión</button></nav>
        <main><h1>Bienvenido al Dashboard</h1><p id="user-display"></p></main>
    </div>

    <script src="app.js"></script>
</body>
</html>
