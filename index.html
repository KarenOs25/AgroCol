<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario | AgroCol S.A.S</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>AgroCol S.A.S</h2>
        <a class="nav-btn" onclick="location.reload()">📦 Inventario</a>
        <a class="nav-btn" onclick="Auth.logout()">🚪 Salir</a>
    </nav>
    <main>
        <div class="card">
            <h3>Registrar Movimiento</h3>
            <input id="nombre" placeholder="Producto">
            <select id="cat"><option>Frutas</option><option>Verduras</option><option>Herramientas</option></select>
            <input id="cant" type="number" placeholder="Cantidad">
            <select id="unidad"><option value="KG">KG</option><option value="UND">UND</option></select>
            <select id="tipo"><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option></select>
            <button class="btn" onclick="guardar()">Procesar</button>
            <button class="btn" onclick="window.print()">🖨️ PDF</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Producto</th><th>Cant</th><th>Estado</th><th>Acción</th></tr></thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
        if (!sessionStorage.getItem('session')) window.location.href = 'login.html';
        function guardar() {
            let p = { n: document.getElementById('nombre').value, q: parseFloat(document.getElementById('cant').value), u: document.getElementById('unidad').value, t: document.getElementById('tipo').value };
            let prods = JSON.parse(localStorage.getItem('prods') || '[]');
            if(p.t === 'SALIDA') p.q = -p.q;
            let ex = prods.find(x => x.n === p.n);
            if(ex) ex.q += p.q; else prods.push(p);
            localStorage.setItem('prods', JSON.stringify(prods));
            render();
        }
        function eliminar(i) {
            let prods = JSON.parse(localStorage.getItem('prods') || '[]');
            prods.splice(i, 1);
            localStorage.setItem('prods', JSON.stringify(prods));
            render();
        }
        function render() {
            let prods = JSON.parse(localStorage.getItem('prods') || '[]');
            document.getElementById('lista').innerHTML = prods.map((p, i) => {
                let status = p.q <= 5 ? '<span style="color:red">⚠️ BAJO</span>' : '✅ OK';
                return `<tr><td>${p.n}</td><td>${p.q} ${p.u}</td><td>${status}</td><td><button onclick="eliminar(${i})">Eliminar</button></td></tr>`;
            }).join('');
        }
        render();
    </script>
</body>
</html>
