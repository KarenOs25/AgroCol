<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroCol | Sistema de Gestión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><h2>AgroCol S.A.S</h2></nav>
    
    <aside class="sidebar">
        <a onclick="showSection('dashboard')">Dashboard</a>
        <a onclick="showSection('inventario')">Inventario</a>
        <a onclick="showSection('reportes')">Reportes</a>
    </aside>

    <main id="main-content">
        </main>

    <script src="js/inventario.js"></script>
    <script src="js/movimientos.js"></script>
    <script src="js/reportes.js"></script>
    <script>
        function showSection(section) {
            if(section === 'inventario') Inventory.renderInventory();
            if(section === 'reportes') Reports.generateReport();
        }
    </script>
</body>
</html>
