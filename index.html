<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroCol S.A.S | Sistema Avanzado</title>
    <style>
        :root { --primary: #166534; --sidebar: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f8fafc; }
        .sidebar { width: 260px; background: var(--sidebar); height: 100vh; color: white; padding: 20px; position: fixed; }
        .sidebar a { display: block; color: #94a3b8; padding: 12px; cursor: pointer; border-bottom: 1px solid #1e293b; }
        main { margin-left: 260px; padding: 40px; width: 100%; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        .btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; color: white; background: var(--primary); }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>AgroCol S.A.S</h2>
    <a onclick="render('dashboard')">📊 Dashboard</a>
    <a onclick="render('inventario')">📦 Gestión Inventario</a>
</div>

<main id="app"></main>

<script>
    let productos = JSON.parse(localStorage.getItem('productos')) || [];

    function render(view) {
        const app = document.getElementById('app');
        if (view === 'dashboard') {
            const total = productos.reduce((sum, p) => sum + (parseFloat(p.precio) * p.cant), 0);
            app.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><h3>Total Productos</h3><p>${productos.length}</p></div>
                    <div class="stat-card"><h3>Valor Inventario</h3><p>$${total.toLocaleString()}</p></div>
                    <div class="stat-card"><h3>Alertas Stock</h3><p>${productos.filter(p => p.cant < 5).length}</p></div>
                </div>`;
        } else {
            app.innerHTML = `
                <div class="card">
                    <input id="desc" placeholder="Producto">
                    <select id="cat"><option>Frutas</option><option>Herramientas</option><option>Abonos</option></select>
                    <input id="cant" type="number" placeholder="Cant">
                    <input id="precio" type="number" placeholder="Precio Unit">
                    <button class="btn" onclick="agregar()">Registrar</button>
                    <button class="btn" style="background:#2563eb" onclick="imprimir()">Imprimir Reporte</button>
                </div>
                <div class="card">
                    <select onchange="filtrar(this.value)">
                        <option value="Todos">Todas las categorías</option>
                        <option value="Frutas">Frutas</option>
                        <option value="Herramientas">Herramientas</option>
                        <option value="Abonos">Abonos</option>
                    </select>
                    <table id="tabla-reporte">
                        <thead><tr><th>Categoría</th><th>Producto</th><th>Cant</th><th>Precio</th></tr></thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>`;
            mostrar(productos);
        }
    }

    function agregar() {
        productos.push({
            cat: document.getElementById('cat').value,
            desc: document.getElementById('desc').value,
            cant: parseFloat(document.getElementById('cant').value),
            precio: parseFloat(document.getElementById('precio').value)
        });
        localStorage.setItem('productos', JSON.stringify(productos));
        render('inventario');
    }

    function mostrar(lista) {
        document.getElementById('lista').innerHTML = lista.map(p => `
            <tr><td>${p.cat}</td><td>${p.desc}</td><td>${p.cant}</td><td>$${p.precio}</td></tr>
        `).join('');
    }

    function filtrar(cat) {
        mostrar(cat === 'Todos' ? productos : productos.filter(p => p.cat === cat));
    }

    function imprimir() {
        const win = window.open('', '_blank');
        win.document.write(`
            <html><body>
                <h1 style="color:green">AgroCol S.A.S - Reporte Oficial</h1>
                ${document.getElementById('tabla-reporte').outerHTML}
                <script>window.print();<\/script>
            </body></html>`);
    }

    render('dashboard');
</script>
</body>
</html>
