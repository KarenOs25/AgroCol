<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroCol S.A.S | ERP Profesional</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sidebar">
        <div class="brand"><h2>AgroCol S.A.S</h2></div>
        <ul class="nav-links">
            <li><a class="nav-btn" onclick="render('dashboard')">📊 Dashboard</a></li>
            <li><a class="nav-btn" onclick="render('inventario')">📦 Inventario</a></li>
            <li><a class="nav-btn" onclick="Auth.logout()">🚪 Salir</a></li>
        </ul>
    </nav>

    <main id="app">
        </main>

    <script src="js/auth.js"></script>
    <script src="js/inventario.js"></script>
    <script src="js/movimientos.js"></script>
    <script src="js/reportes.js"></script>

    <script>
        function render(view) {
            const app = document.getElementById('app');
            const prods = JSON.parse(localStorage.getItem('productos') || '[]');
            
            if (view === 'dashboard') {
                const alertas = prods.filter(p => p.cantidad <= 5).length;
                app.innerHTML = `
                    <div class="dashboard-grid">
                        <div class="card"><h3>Total Productos</h3><p>${prods.length}</p></div>
                        <div class="card" style="border-left: 5px solid #e11d48;"><h3>Alertas Stock</h3><p>${alertas}</p></div>
                    </div>
                    <div class="card">
                        <h2>Registrar Movimiento</h2>
                        <select id="mov-id">${prods.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('')}</select>
                        <input type="number" id="mov-cant" placeholder="Cantidad">
                        <select id="mov-tipo"><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option></select>
                        <button class="btn" onclick="ejecutarMovimiento()">Procesar</button>
                    </div>
                `;
            } else if (view === 'inventario') {
                app.innerHTML = `
                    <div class="card">
                        <input type="text" id="search" placeholder="🔍 Buscar..." onkeyup="filterTable()">
                        <table>
                            <thead><tr><th>ID</th><th>Nombre</th><th>Cat</th><th>Cant</th><th>Acción</th></tr></thead>
                            <tbody id="lista"></tbody>
                        </table>
                    </div>
                `;
                Inventario.renderTable();
            }
        }

        function ejecutarMovimiento() {
            const id = document.getElementById('mov-id').value;
            const cant = document.getElementById('mov-cant').value;
            const tipo = document.getElementById('mov-tipo').value;
            Movimientos.registrar(id, cant, tipo);
            render('dashboard');
        }

        window.onload = () => render('dashboard');
    </script>
</body>
</html>
