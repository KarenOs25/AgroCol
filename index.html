<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroCol | ERP Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <h2>AgroCol S.A.S</h2>
        <a onclick="render('dashboard')">📊 Dashboard</a>
        <a onclick="render('inventario')">📦 Inventario</a>
    </div>

    <main id="app"></main>

    <script>
        let productos = JSON.parse(localStorage.getItem('productos')) || [];

        function render(view) {
            const app = document.getElementById('app');
            if (view === 'dashboard') {
                app.innerHTML = `<div class="card"><h1>Dashboard</h1><p>Bienvenido al sistema de gestión agrícola AgroCol.</p></div>`;
            } else {
                app.innerHTML = `
                    <div class="card">
                        <h2>Registrar Producto</h2>
                        <input id="desc" placeholder="Nombre">
                        <select id="cat">
                            <option>Frutas</option><option>Herramientas</option><option>Abonos</option>
                        </select>
                        <input id="cant" type="number" placeholder="Cantidad">
                        <button class="btn" onclick="agregar()">Guardar</button>
                    </div>
                    <div class="card">
                        <table>
                            <thead><tr><th>Categoría</th><th>Producto</th><th>Cant</th><th>Acción</th></tr></thead>
                            <tbody id="lista"></tbody>
                        </table>
                    </div>`;
                actualizarTabla();
            }
        }

        function agregar() {
            productos.push({
                cat: document.getElementById('cat').value,
                desc: document.getElementById('desc').value,
                cant: document.getElementById('cant').value
            });
            localStorage.setItem('productos', JSON.stringify(productos));
            actualizarTabla();
        }

        function actualizarTabla() {
            document.getElementById('lista').innerHTML = productos.map((p, i) => `
                <tr><td>${p.cat}</td><td>${p.desc}</td><td>${p.cant}</td>
                <td><button onclick="eliminar(${i})">X</button></td></tr>
            `).join('');
        }

        function eliminar(i) {
            productos.splice(i, 1);
            localStorage.setItem('productos', JSON.stringify(productos));
            actualizarTabla();
        }

        render('dashboard');
    </script>
</body>
</html>
