<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgroCol S.A.S | ERP</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>AgroCol S.A.S</h2>
        <a class="nav-btn" onclick="render('dashboard')">📊 Dashboard</a>
        <a class="nav-btn" onclick="render('inventario')">📦 Inventario</a>
        <a class="nav-btn" onclick="Auth.logout()">🚪 Salir</a>
    </nav>
    <main id="app"></main>

    <script src="js/auth.js"></script>
    <script src="js/inventario.js"></script>
    <script>
        Auth.check();
        function render(view) {
            const app = document.getElementById('app');
            const prods = JSON.parse(localStorage.getItem('productos') || '[]');
            
            if (view === 'dashboard') {
                app.innerHTML = `<h1>Dashboard</h1><div class="card">Total productos registrados: ${prods.length}</div>`;
            } else {
                app.innerHTML = `
                    <div class="card">
                        <h3>Registrar Producto</h3>
                        <input id="nombre" placeholder="Nombre del producto">
                        <select id="cat">
                            <option>Frutas</option><option>Verduras</option>
                            <option>Herramientas</option><option>Abonos</option>
                        </select>
                        <input id="cantidad" type="number" placeholder="Cantidad">
                        <button class="btn" onclick="Inventario.guardar()">Guardar</button>
                    </div>
                    <div class="card">
                        <table>
                            <thead><tr><th>Nombre</th><th>Categoría</th><th>Cantidad</th></tr></thead>
                            <tbody>${prods.map(p => `<tr><td>${p.nombre}</td><td>${p.cat}</td><td>${p.cantidad}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>`;
            }
        }
        render('dashboard');
    </script>
</body>
</html>
