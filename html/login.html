<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | AgroCol S.A.S</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="login-container">
        <h2>AgroCol S.A.S</h2>
        <p>Sistema de Gestión de Inventarios</p>
        
        <div class="form-group">
            <input type="text" id="user" placeholder="Usuario" required>
        </div>
        
        <div class="form-group">
            <input type="password" id="pass" placeholder="Contraseña" required>
        </div>
        
        <button onclick="Auth.login(document.getElementById('user').value, document.getElementById('pass').value)">
            Ingresar al Sistema
        </button>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
