<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | AgroCol S.A.S</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="card login-box">
        <h3>Nuevo Usuario</h3>
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="text" id="u" placeholder="Nombre de usuario">
        <input type="email" id="email" placeholder="Correo (opcional)">
        <input type="password" id="p" placeholder="Contraseña">
        <input type="password" id="p2" placeholder="Confirmar contraseña">
        <button class="btn" onclick="Auth.registrar()">Registrarse</button>
        <p><a href="login.html" style="color: #1e4d2b;">Volver al Login</a></p>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
